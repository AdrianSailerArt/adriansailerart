name: Deploy Nuxt to GitHub Pages

on:
  push:
    branches:
      - main
  # Manuell neu starten (Actions → Deploy Nuxt to GitHub Pages → Run workflow)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; ein laufendes wird nicht abgebrochen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Bauen und Hochladen getrennt vom Veröffentlichen (Aufbau laut GitHub-Vorlage):
  # Das Artefakt ist abgeschlossen, bevor der Deploy-Job danach sucht, und
  # „Re-run failed jobs“ wiederholt nur das Veröffentlichen ohne doppeltes Artefakt.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Generate Nuxt site
        run: bun run generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

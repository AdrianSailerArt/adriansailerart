name: Deploy Nuxt to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Generate Nuxt site
        run: bun run generate
        # Solange adriansailer.de noch nicht aktiv ist, läuft die Seite unter github.io/adriansailerart/.
        # Sobald die eigene Domain in den Pages-Einstellungen eingetragen ist: diese env-Zeilen löschen.
        env:
          DEPLOY_SITE_URL: https://adriansailerart.github.io
          DEPLOY_BASE_URL: /adriansailerart/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy
        uses: actions/deploy-pages@v4